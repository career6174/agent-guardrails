name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install pytest
      - run: python -m pytest -q tests
  install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: One-command install into a clean config, twice
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude config"
          export AGENT_GUARDRAILS_REPO="$GITHUB_WORKSPACE"
          bash install.sh
          bash install.sh | grep "Already registered"
      - name: The registered hook commands run in bash and block a dangerous command
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude config"
          python .github/run_registered_hooks.py
      - name: Doctor, then uninstall leaves an empty settings file
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude config"
          python "$CLAUDE_CONFIG_DIR/agent-guardrails/install.py" --doctor
          python "$CLAUDE_CONFIG_DIR/agent-guardrails/install.py" --uninstall
          test "$(tr -d '[:space:]' < "$CLAUDE_CONFIG_DIR/settings.json")" = "{}"
